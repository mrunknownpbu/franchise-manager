version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: franchise-manager
    ports:
      - "${APP_PORT:-8787}:8787"
    environment:
      - APP_PORT=${APP_PORT:-8787}
      - TZ=${TZ:-UTC}
      - DATABASE_PATH=${DATABASE_PATH:-/config/franchise-manager.db}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - RADARR_URL=${RADARR_URL}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - RADARR_ROOT_FOLDER=${RADARR_ROOT_FOLDER}
      - RADARR_QUALITY_PROFILE_ID=${RADARR_QUALITY_PROFILE_ID}
      - MOVIE_LIBRARY_PATH=${MOVIE_LIBRARY_PATH}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SYNC_ENABLED=${SYNC_ENABLED:-true}
      - SYNC_INTERVAL_HOURS=${SYNC_INTERVAL_HOURS:-6}
      - AUTO_ADD_MISSING=${AUTO_ADD_MISSING:-false}
      - MATCH_CONFIDENCE_THRESHOLD=${MATCH_CONFIDENCE_THRESHOLD:-70}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SESSION_TIMEOUT_HOURS=${SESSION_TIMEOUT_HOURS:-24}
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY:-change-me-in-production}
    volumes:
      - config:/config
      - ${MOVIE_LIBRARY_PATH}:${MOVIE_LIBRARY_PATH}:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - default

volumes:
  config:
    driver: local

networks:
  default:
    driver: bridge
