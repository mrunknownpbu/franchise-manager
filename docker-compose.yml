services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8787}:8787"
    env_file: .env
    volumes:
      - config:/config
      - "${MOVIE_LIBRARY_PATH:-./movies}:${MOVIE_LIBRARY_PATH:-/movies}:ro"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8787/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  config:
