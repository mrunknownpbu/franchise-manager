<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Franchise Manager</title><style>body{font:16px system-ui;background:#10131a;color:#eef;margin:0}main{max-width:1000px;margin:auto;padding:32px}header{display:flex;justify-content:space-between;align-items:center}.card{background:#1b2130;padding:20px;border-radius:12px;margin:16px 0}button{background:#6d5dfc;color:white;border:0;padding:10px 16px;border-radius:8px;cursor:pointer}input{padding:10px;border-radius:8px;border:1px solid #555;background:#111827;color:#fff}small{color:#aab}</style></head><body><main><header><h1>Franchise Manager</h1><button onclick="logout()">Sign out</button></header><section id="login" class="card"><h2>Sign in</h2><input id="u" placeholder="Username" value="admin"><input id="p" type="password" placeholder="Password"><button onclick="login()">Sign in</button><p id="err"></p></section><section id="app" hidden><div class="card"><h2>Collections</h2><button onclick="search()">Refresh</button><div id="collections"></div></div><div class="card"><h2>TMDb collection</h2><input id="cid" type="number" placeholder="TMDb collection ID"><button onclick="add()">Add collection</button></div></section></main><script>let token=localStorage.token;const $=x=>document.getElementById(x);async function api(url,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};let r=await fetch('/api'+url,o);if(!r.ok)throw Error(await r.text());return r.json()}function show(){ $('login').hidden=!!token;$('app').hidden=!token;if(token)search()}async function login(){try{let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('u').value,password:$('p').value})});if(!r.ok)throw Error('Invalid credentials');token=(await r.json()).token;localStorage.token=token;show()}catch(e){$('err').textContent=e.message}}async function search(){try{let cs=await api('/collections');$('collections').innerHTML=cs.length?cs.map(c=>`<article><h3>${c.name}</h3><small>TMDb ${c.tmdb_collection_id} - ${c.enabled?'Monitoring':'Paused'}</small></article>`).join(''):'<p>No collections yet.</p>'}catch(e){$('err').textContent=e.message}}async function add(){try{let r=await api('/tmdb/collections/'+$('cid').value);await api('/collections',{method:'POST',body:JSON.stringify({tmdb_collection_id:r.id,name:r.name,poster_path:r.poster_path,backdrop_path:r.backdrop_path,overview:r.overview})});search()}catch(e){alert(e.message)}}function logout(){localStorage.removeItem('token');token=null;show()}show()</script></body></html>
